name: tests

on:
  push:
    branches: [main, complete-development-20260825]
  pull_request:

permissions:
  contents: write

jobs:
  apply-recommendation-fix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch recommendation polling and role-aware results
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch target: {label}')
              return text.replace(old, new, 1)

          vue_path = Path('frontend/src/UnifiedWorkspace.vue')
          text = vue_path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              "const active=recJobs.value.find(x=>['starting','screening','refining'].includes(x.status));",
              "const active=recJobs.value.find(x=>['queued','starting','screening','refining'].includes(x.status));",
              'queued active polling',
          )

          old_open = "async function openRecJob(job){stopRecPoll();recPollError.value='';recSelectedJob.value=job;recProgress.value=job;recRunning.value=recSelectedBusy.value;selectedBuild.value=null;recResult.value=job.status==='completed'?(job.result||null):null;if(job.status==='completed'&&!recResult.value){try{const state=await api(`/api/hero-core/recommend/status?job_id=${encodeURIComponent(job.id)}`),fresh=(state.jobs||[]).find(x=>x.id===job.id);if(!fresh)throw new Error(zh.value?'找不到该推荐任务。':'Recommendation job not found.');recSelectedJob.value=fresh;recProgress.value=fresh;recResult.value=fresh.result||null;recRunning.value=false}catch(e){recPollError.value=e?.message||'Unable to load recommendation result';feedback(e)}}else if(job.status==='failed'){feedback(new Error(job.error||'Recommendation failed'))}else if(recSelectedBusy.value){startRecPoll()}}"
          new_open = """function focusRecResults(){requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelector('.recommendation-results')?.scrollIntoView({behavior:'smooth',block:'start'})))}
          async function openRecJob(job){
            stopRecPoll();recPollError.value='';recSelectedJob.value=job;recProgress.value=job;recRunning.value=recSelectedBusy.value;selectedBuild.value=null;recResult.value=job.status==='completed'?(job.result||null):null
            if(job.status==='completed'&&!recResult.value){
              try{const state=await api(`/api/hero-core/recommend/status?job_id=${encodeURIComponent(job.id)}`),fresh=(state.jobs||[]).find(x=>x.id===job.id);if(!fresh)throw new Error(zh.value?'找不到该推荐任务。':'Recommendation job not found.');recSelectedJob.value=fresh;recProgress.value=fresh;recResult.value=fresh.result||null;recRunning.value=false}
              catch(e){recPollError.value=e?.message||'Unable to load recommendation result';feedback(e)}
            }else if(job.status==='failed'){feedback(new Error(job.error||'Recommendation failed'))}
            else if(recSelectedBusy.value){startRecPoll()}
            if(recResult.value)focusRecResults()
          }"""
          text = replace_once(text, old_open, new_open, 'open completed recommendation')

          old_rows = "function recVal(r,k){return k==='ed60'?r.equivalent_60s?.mean:k==='actual'?r.actual_60s?.mean:k==='delta'?r.delta_vs_best:r[k]}\nconst recRows=computed(()=>{const rows=recResult.value?.results||[],s=recSort.value;return [...rows].sort((a,b)=>cmp(recVal(a,s.key),recVal(b,s.key))*(s.direction==='asc'?1:-1))})"
          new_rows = """const recResultCategory=computed(()=>String(recResult.value?.results?.[0]?.recommendation_profile?.category||'output').toLowerCase())
          const recIsOutputResult=computed(()=>recResultCategory.value==='output')
          function recScore(r){return recIsOutputResult.value?(r?.equivalent_60s?.mean??r?.role_score):(r?.role_score??r?.equivalent_60s?.mean)}
          function recSecondaryMetric(r){const m=r?.role_metrics||{},c=recResultCategory.value;if(c==='tank')return m.defense_gain;if(c==='healing')return m.healing_effect;if(c==='support')return m.set_utility;return r?.actual_60s?.mean}
          function recSecondaryLabel(){const c=recResultCategory.value;if(recIsOutputResult.value)return t('actual60');if(c==='tank')return zh.value?'防御增益':'DEF Gain';if(c==='healing')return zh.value?'治疗效果':'Healing';if(c==='support')return zh.value?'套装收益':'Set Utility';return zh.value?'角色指标':'Role Metric'}
          function recSecondaryText(r){const value=recSecondaryMetric(r);if(recIsOutputResult.value)return n(value,0);return recResultCategory.value==='support'?n(value,3):pct(value)}
          function recPanelStats(r){const p=r?.panel||{},m=r?.role_metrics||{},c=recResultCategory.value;if(recIsOutputResult.value)return [`ATK ${n(p.atk,0)}`,`${zh.value?'暴击':'CRIT'} ${pct(p.crit_rate)}`,`${zh.value?'暴伤':'CRIT DMG'} ${pct(p.crit_dmg)}`,`${zh.value?'攻速':'ATK SPD'} ${n(p.atk_speed,0)}`];if(c==='tank')return [`HP ${n(p.hp,0)}`,`DEF ${n(p.defense,0)}`,`${zh.value?'生命增益':'HP Gain'} ${pct(m.hp_gain)}`,`${zh.value?'防御增益':'DEF Gain'} ${pct(m.defense_gain)}`];if(c==='healing')return [`ATK ${n(p.atk,0)}`,`HP ${n(p.hp,0)}`,`${zh.value?'治疗':'Healing'} ${pct(p.healing_effect)}`,`${zh.value?'怒气':'Rage'} ${pct(p.rage_regen)}`];return [`ATK SPD ${n(p.atk_speed,0)}`,`${zh.value?'怒气':'Rage'} ${pct(p.rage_regen)}`,`HP ${n(p.hp,0)}`,`${zh.value?'套装收益':'Set Utility'} ${n(m.set_utility,3)}`]}
          function recVal(r,k){return k==='ed60'?recScore(r):k==='actual'?recSecondaryMetric(r):k==='delta'?r.delta_vs_best:r[k]}
          const recRows=computed(()=>{const rows=recResult.value?.results||[],s=recSort.value;return [...rows].sort((a,b)=>cmp(recVal(a,s.key),recVal(b,s.key))*(s.direction==='asc'?1:-1))})"""
          text = replace_once(text, old_rows, new_rows, 'role-aware result helpers')

          text = replace_once(
              text,
              "<th @click=\"toggleSort(recSort,'ed60')\">{{t('ed60')}} <i>{{mark(recSort,'ed60')}}</i></th>",
              "<th @click=\"toggleSort(recSort,'ed60')\">{{recIsOutputResult?t('ed60'):(zh?'角色评分':'Role Score')}} <i>{{mark(recSort,'ed60')}}</i></th>",
              'score heading',
          )
          text = replace_once(
              text,
              "<th @click=\"toggleSort(recSort,'actual')\">{{t('actual60')}} <i>{{mark(recSort,'actual')}}</i></th>",
              "<th @click=\"toggleSort(recSort,'actual')\">{{recSecondaryLabel()}} <i>{{mark(recSort,'actual')}}</i></th>",
              'secondary heading',
          )
          text = replace_once(
              text,
              "<td class=\"score-cell\"><strong>{{n(r.equivalent_60s.mean,0)}}</strong><small>± {{n(r.equivalent_60s.stddev,0)}}</small></td>",
              "<td class=\"score-cell\"><strong>{{n(recScore(r),recIsOutputResult?0:3)}}</strong><small v-if=\"recIsOutputResult\">± {{n(r.equivalent_60s?.stddev??r.equivalent_60s?.std,0)}}</small><small v-else>{{zh?'角色目标综合评分':'Role objective score'}}</small></td>",
              'score cell',
          )
          text = replace_once(
              text,
              "<td>{{n(r.actual_60s.mean,0)}}</td>",
              "<td>{{recSecondaryText(r)}}</td>",
              'secondary cell',
          )
          text = replace_once(
              text,
              "<td><div class=\"mini-panel\"><span>ATK {{n(r.panel.atk,0)}}</span><span>{{zh?'暴击':'CRIT'}} {{pct(r.panel.crit_rate)}}</span><span>{{zh?'暴伤':'CRIT DMG'}} {{pct(r.panel.crit_dmg)}}</span><span>{{zh?'攻速':'ATK SPD'}} {{n(r.panel.atk_speed,0)}}</span></div></td>",
              "<td><div class=\"mini-panel\"><span v-for=\"x in recPanelStats(r)\" :key=\"x\">{{x}}</span></div></td>",
              'role-aware panel',
          )

          old_modal = "<div class=\"build-detail-summary\"><span>{{t('ed60')}} <strong>{{n(selectedBuild.equivalent_60s?.mean,0)}}</strong></span><span>{{t('actual60')}} <strong>{{n(selectedBuild.actual_60s?.mean,0)}}</strong></span><span>ATK <strong>{{n(selectedBuild.panel?.atk,0)}}</strong></span><span>{{zh?'暴击':'CRIT'}} <strong>{{pct(selectedBuild.panel?.crit_rate)}}</strong></span><span v-if=\"selectedBuild.equipment_projection?.locked_substat_percentile!=null\">{{zh?'未解锁副词条':'Locked sub-stats'}} <strong>P{{Math.round(selectedBuild.equipment_projection.locked_substat_percentile*100)}}</strong></span><span v-if=\"selectedBuild.active_set_names?.length\">{{zh?'最终套装':'Final Sets'}} <strong>{{selectedBuild.active_set_names.map(term).join(' + ')}}</strong></span></div>"
          new_modal = "<div class=\"build-detail-summary\"><span>{{recIsOutputResult?t('ed60'):(zh?'角色评分':'Role Score')}} <strong>{{n(recScore(selectedBuild),recIsOutputResult?0:3)}}</strong></span><span v-if=\"recIsOutputResult\">{{t('actual60')}} <strong>{{n(selectedBuild.actual_60s?.mean,0)}}</strong></span><span v-for=\"x in recPanelStats(selectedBuild)\" :key=\"x\"><strong>{{x}}</strong></span><span v-if=\"selectedBuild.equipment_projection?.locked_substat_percentile!=null\">{{zh?'未解锁副词条':'Locked sub-stats'}} <strong>P{{Math.round(selectedBuild.equipment_projection.locked_substat_percentile*100)}}</strong></span><span v-if=\"selectedBuild.active_set_names?.length\">{{zh?'最终套装':'Final Sets'}} <strong>{{selectedBuild.active_set_names.map(term).join(' + ')}}</strong></span></div>"
          text = replace_once(text, old_modal, new_modal, 'build detail summary')

          text = replace_once(
              text,
              "view==='recommendation'?(zh?'最终排名由 HeroCore 稳定态 ED60 决定。':'Final ranking is determined by HeroCore steady-state ED60.')",
              "view==='recommendation'?(zh?'输出英雄按 HeroCore ED60 排名，防御、治疗与辅助英雄按角色目标评分排名。':'Output heroes rank by HeroCore ED60; tank, healing, and support heroes rank by role objectives.')",
              'recommendation description',
          )

          vue_path.write_text(text, encoding='utf-8')

          api_path = Path('web_api.py')
          api_text = api_path.read_text(encoding='utf-8')
          old_api = '''            # Completed results are part of the queue item as well.  The\n            # frontend can therefore render a finished job immediately after\n            # polling, without racing a second request for the same job.\n            if job.get("status") == "completed":\n                item["result"] = job.get("result")'''
          new_api = '''            # Keep queue polling lightweight. Attach the potentially large result\n            # only when the caller explicitly requests that completed job.\n            if job.get("status") == "completed" and job_id and job.get("id") == job_id:\n                item["result"] = job.get("result")'''
          api_text = replace_once(api_text, old_api, new_api, 'scoped recommendation result payload')
          api_path.write_text(api_text, encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests before push
        run: |
          python -m pip install --upgrade pip pillow
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build patched Vue frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit and push fix
        shell: bash
        run: |
          git checkout HEAD^ -- .github/workflows/tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/UnifiedWorkspace.vue web_api.py .github/workflows/tests.yml
          git commit -m "Fix role-aware recommendation results"
          git push origin HEAD:main

  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pillow
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run deterministic random equipment validation
        run: python validate_random_builds.py --seed 20260825 --items-per-slot 4 --top-k 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Vue frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
