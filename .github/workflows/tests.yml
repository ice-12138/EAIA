name: tests

on:
  push:
    branches: [main, review-fixes-20260825]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pillow
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
